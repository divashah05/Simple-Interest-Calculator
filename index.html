<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Interest Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Simple Interest Calculator</h1>
    <p class="subtitle">Calculate the interest earned on your investment.</p>

    <form id="interestForm">
      <label for="principal">Principal Amount (₹)</label>
      <input type="number" id="principal" min="0" step="any" placeholder="Enter principal amount" required>

      <label for="rate">Annual Interest Rate (%)</label>
      <input type="number" id="rate" min="0" step="any" placeholder="Enter interest rate" required>

      <label for="time">Time (years)</label>
      <input type="number" id="time" min="0" step="any" placeholder="Enter time in years" required>

      <button type="submit">Calculate Interest</button>
      <button type="reset" class="reset">Reset</button>
    </form>

    <section id="result" class="result" aria-live="polite" hidden>
      <h2>Calculation Result</h2>
      <p>Simple Interest: <strong id="interest">₹0.00</strong></p>
      <p>Total Amount: <strong id="total">₹0.00</strong></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
